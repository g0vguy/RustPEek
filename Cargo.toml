[package]
name = "RustPEek"
version = "0.4.0"
edition = "2021"

[[bin]]
name = "RustPEek"
path = "src/main.rs"

[dependencies]
goblin = { version = "0.8", features = ["pe32", "pe64"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
ratatui = "0.28"
crossterm = "0.28"
cli-clipboard = "0.4"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "nasm"] }
sha2 = "0.10"
pelite = "0.10"
lazy_static = "1.4"